---
# --------------------------------

name: "Lint Ansible"
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v2
    - name: "yamllint"
      uses: karancode/yamllint-github-action@master
      with:
        yamllint_comment: false
        yamllint_config_filepath: .config/yamllint
        yamllint_file_or_dir: "."
        yamllint_strict: true
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v3
    - name: "Setup Python"
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"
    - name: "Add Packages"
      run: |
        python -m pip install --upgrade pip
        pip install ansible-core==2.21.5 ansible-lint==26.10.1
    - name: "ansible-lint"
      run: ansible-lint --config .config/ansible-lint.yml --exclude=playbooks

